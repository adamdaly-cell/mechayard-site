<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mechayard logo">
  <title>Mechayard</title>
  <!-- hex bolt head -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="#15171a" stroke="#F5B700" stroke-width="4" stroke-linejoin="round"/>
  <!-- girder M -->
  <polyline points="19,43 19,22 32,33 45,22 45,43" fill="none" stroke="#F5B700" stroke-width="5" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- girder bracing -->
  <line x1="19" y1="33" x2="25" y2="28" stroke="#F5B700" stroke-width="2"/>
  <line x1="45" y1="33" x2="39" y2="28" stroke="#F5B700" stroke-width="2"/>
  <!-- status light -->
  <circle cx="32" cy="45" r="3" fill="#FF5A1F"/>
</svg>
